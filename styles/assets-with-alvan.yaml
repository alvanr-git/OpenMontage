identity:
  name: "Assets with Alvan Editorial"
  category: minimalist
  mood: warm, architectural, authoritative
  pace: deliberate
  best_for: "Personal brand reels, architectural breakdowns, landed subdivision analysis, commercial shophouse and co-living yield comparisons"

taste_profile:
  design_read: "Architectural real estate advisory: Leica-warm editorial framing, deep navy and warm gold authority, generous breathing room."
  visual_variance: 5
  motion_intensity: 4
  information_density: 5
  palette_discipline: "Soft warm light-grey field (#F5F7FA), deep navy typography (#182B49), warm gold accent (#B89152), zero corporate gradient clutter."
  layout_variation: "Alternate site-blueprint split frames, slightly rotated (-4 to +5 degree) property accent cards, and crisp financial comparison tables."
  reference_strategy: "Anchor scenes with authentic architectural diagrams, cadastral boundaries, or Leica-style warm site photography."
  anti_patterns:
    - "generic corporate real estate flyer templates"
    - "neon gradients or oversaturated stock graphics"
    - "dense walls of bullet points without 20% margin padding"
  quality_gates:
    - "Maintain generous 20% margin padding so text never collides with frame edges or footers."
    - "Limit each visual card to one core architectural or financial idea per slide/cut."

visual_language:
  color_palette:
    primary: ["#182B49", "#2F5597"]
    accent: ["#B89152", "#0F766E"]
    background: "#F5F7FA"
    text: "#182B49"
    muted: "#475569"
  composition: editorial 20-percent margin grid with subtle rotated accent photo frames and bold architectural callouts
  texture: warm matte paper field, fine architectural section lines, subtle Leica film grain on photography

typography:
  headings:
    font: "Inter"
    weight: 700
    tracking: "-0.01em"
  body:
    font: "Inter"
    weight: 400
    line_height: 1.5
  code:
    font: "JetBrains Mono"
    weight: 400
  stat_card:
    font: "Inter"
    weight: 800
    size_multiplier: 3.0
  scale_system: "major_third"
  weight_matrix:
    title: 800
    heading: 700
    body: 400
    caption: 500

motion:
  transitions: [fade, dissolve, slide-left]
  animation_style: "deliberate editorial ease-out, crisp architectural line reveals"
  pacing_rules:
    min_scene_hold_seconds: 2.5
    max_scene_hold_seconds: 10
    text_card_hold_seconds: 3.5
    stat_card_hold_seconds: 3.25
    transition_duration_seconds: 0.4
  entrance: "fade-up 12px with subtle opacity ramp"
  exit: "clean dissolve"

audio:
  voice_style: "personable architect-advisor, calm conviction, friend-POV warmth"
  music_mood: "warm minimal acoustic-electronic pulse, understated luxury"
  music_volume: 0.08
  sfx_style: "subtle camera shutter clicks, tactile paper and blueprint drafts"
  ducking_threshold_db: -4

asset_generation:
  image_prompt_prefix: "Editorial Leica architectural photography, warm natural lighting, high contrast, Singapore luxury landed and heritage shophouse context, generous negative space, "
  image_negative_prompt: "cartoonish, neon, oversaturated corporate stock, cluttered text overlay, low resolution, distorted architecture"
  diagram_style: "clean architectural section and cadastral site diagram, deep navy #182B49 lines, warm gold #B89152 highlights, off-white #F5F7FA background"
  consistency_anchors:
    - "Light warm-grey #F5F7FA background with deep navy #182B49 typography"
    - "Warm gold #B89152 accent reserved for key yield metrics and envelope callouts"
    - "20% margin padding around all text and stat containers"
    - "Editorial Leica photographic warmth across B-roll and stills"

overlays:
  stat_card:
    bg: "#FFFFFF"
    border: "#CBD5E1"
    text: "#182B49"
    accent: "#B89152"
    radius: 8
    shadow: "0 2px 10px rgba(24,43,73,0.08)"
  key_term:
    bg: "#182B49"
    text: "#FFFFFF"
    accent: "#B89152"
    radius: 6
  code_block:
    bg: "#182B49"
    text: "#F5F7FA"
    highlight: "#B89152"
  section_title:
    bg: "#FFFFFF"
    text: "#182B49"
    accent: "#B89152"
  stat_reveal:
    bg: "#FFFFFF"
    text: "#182B49"
    accent: "#B89152"
  hero_title:
    bg: "#182B49"
    text: "#FFFFFF"
    accent: "#B89152"
  provider_chip:
    bg: "#FFFFFF"
    text: "#182B49"
    border: "#CBD5E1"

quality_rules:
  - "Minimum contrast ratio 4.5:1 for all text"
  - "Maintain 20% margin padding on top, bottom, and sides for mobile vertical readability"
  - "Keep one primary architectural or financial takeaway per frame"
  - "Use gold accent (#B89152) selectively for focal metrics or envelope boundaries"

chart_palette:
  - "#182B49"
  - "#2F5597"
  - "#B89152"
  - "#475569"

color_rules:
  harmony_type: "complementary"
  contrast_validation: true
  colorblind_safe: true
